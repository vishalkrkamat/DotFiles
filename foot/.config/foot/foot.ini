# Foot terminal configuration using Catppuccin Mocha.
[main]
font=JetBrainsMono Nerd Font:size=12
term=foot
app-id=foot
dpi-aware=no
bold-text-in-bright=no
initial-window-size-pixels=1100x700

[scrollback]
lines=20000
multiplier=3.0
indicator-position=relative
indicator-format=percentage

[colors-dark]
background=1E1E2E
foreground=CDD6F4

regular0=45475A
regular1=F38BA8
regular2=A6E3A1
regular3=F9E2AF
regular4=89B4FA
regular5=F5C2E7
regular6=94E2D5
regular7=BAC2DE

bright0=585B70
bright1=F38BA8
bright2=A6E3A1
bright3=F9E2AF
bright4=89B4FA
bright5=F5C2E7
bright6=89DCEB
bright7=A6ADC8

selection-foreground=CDD6F4
selection-background=45475A

alpha=1.0

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes
alternate-scroll-mode=no

[key-bindings]
clipboard-copy=Control+Shift+C
clipboard-paste=Control+Shift+V
search-start=Control+Shift+F
font-reset=Control+0
