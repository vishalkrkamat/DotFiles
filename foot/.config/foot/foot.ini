# Foot terminal configuration using Catppuccin Mocha.
[main]
initial-color-theme=dark
font=JetBrainsMono Nerd Font:size=12
term=foot
app-id=foot
dpi-aware=no
bold-text-in-bright=no
initial-window-size-pixels=1100x700

[scrollback]
lines=20000
multiplier=3.0
indicator-position=relative
indicator-format=percentage

[colors-dark]
background=232136
foreground=e0def4

regular0=393552
regular1=eb6f92
regular2=31748f
regular3=f6c177
regular4=3e8fb0
regular5=ea9a97
regular6=9ccfd8
regular7=908caa

bright0=393552
bright1=eb6f92
bright2=31748f
bright3=f6c177
bright4=3e8fb0
bright5=ea9a97
bright6=9ccfd8
bright7=6e6a86

selection-foreground=e0def4
selection-background=393552

alpha=1.0

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes
alternate-scroll-mode=no

[key-bindings]
clipboard-copy=Control+Shift+C
clipboard-paste=Control+Shift+V
search-start=Control+Shift+F
font-reset=Control+0

[colors-light]
background=eff1f5
foreground=4c4f69
regular0=bcc0cc
regular1=d20f39
regular2=40a02b
regular3=df8e1d
regular4=1e66f5
regular5=ea76cb
regular6=179299
regular7=5c5f77
bright0=9ca0b0
bright1=d20f39
bright2=40a02b
bright3=df8e1d
bright4=1e66f5
bright5=ea76cb
bright6=04a5e5
bright7=6c6f85
selection-foreground=4c4f69
selection-background=bcc0cc
