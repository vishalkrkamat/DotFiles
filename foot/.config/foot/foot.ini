# Foot terminal configuration using Catppuccin Mocha.
[main]
initial-color-theme=dark
font=JetBrainsMono Nerd Font:size=12
term=foot
app-id=foot
dpi-aware=no
bold-text-in-bright=no
initial-window-size-pixels=1100x700

[scrollback]
lines=20000
multiplier=3.0
indicator-position=relative
indicator-format=percentage

[colors-dark]
background=24283b
foreground=c0caf5

regular0=3b4261
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=73daca
regular7=a9b1d6

bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=9aa5ce

selection-foreground=c0caf5
selection-background=3b4261

alpha=1.0

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes
alternate-scroll-mode=no

[key-bindings]
clipboard-copy=Control+Shift+C
clipboard-paste=Control+Shift+V
search-start=Control+Shift+F
font-reset=Control+0

[colors-light]
background=eff1f5
foreground=4c4f69
regular0=bcc0cc
regular1=d20f39
regular2=40a02b
regular3=df8e1d
regular4=1e66f5
regular5=ea76cb
regular6=179299
regular7=5c5f77
bright0=9ca0b0
bright1=d20f39
bright2=40a02b
bright3=df8e1d
bright4=1e66f5
bright5=ea76cb
bright6=04a5e5
bright7=6c6f85
selection-foreground=4c4f69
selection-background=bcc0cc
