set -g status-style "bg=#24283b,fg=#c0caf5"
set -g status-left "#[fg=#24283b,bg=#bb9af7,bold] #S #[default]"
set -g status-right "#[fg=#a9b1d6,bg=#292e42] %Y-%m-%d %H:%M #[default]"
set-window-option -g window-status-format "#[fg=#a9b1d6,bg=#24283b] #I #W "
set-window-option -g window-status-current-format "#[fg=#24283b,bg=#bb9af7,bold] #I #W "
