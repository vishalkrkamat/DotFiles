set -g status-style "bg=#232136,fg=#e0def4"
set -g status-left "#[fg=#232136,bg=#c4a7e7,bold] #S #[default]"
set -g status-right "#[fg=#908caa,bg=#2a273f] %Y-%m-%d %H:%M #[default]"
set-window-option -g window-status-format "#[fg=#908caa,bg=#232136] #I #W "
set-window-option -g window-status-current-format "#[fg=#232136,bg=#c4a7e7,bold] #I #W "
