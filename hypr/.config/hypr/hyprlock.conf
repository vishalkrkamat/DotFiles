# Catppuccin Mocha colors.

background {
    monitor =
    path = $HOME/Pictures/Wallpapers/wall5.png
    color = rgba(36, 40, 59, 1.0)
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

general {
    hide_cursor = false
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(122, 162, 247, 0.9)
    inner_color = rgba(36, 40, 59, 0.9)
    font_color = rgb(192, 202, 245)
    font_family = Noto Sans
    fade_on_empty = false
    rounding = -1
    check_color = rgb(158, 206, 106)
    placeholder_text = Enter password
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(192, 202, 245, 0.75)
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +%-I:%M)"
    color = rgba(192, 202, 245, 0.75)
    font_size = 95
    font_family = JetBrains Mono Extrabold
    position = 0, 200
    halign = center
    valign = center
}
